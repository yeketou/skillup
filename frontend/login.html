<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillUp — Sign In</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI',system-ui,sans-serif;
    background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 60%,#0891B2 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .card {
    background:white; border-radius:20px; padding:48px 40px;
    width:100%; max-width:420px; box-shadow:0 25px 60px rgba(0,0,0,.25);
  }
  .logo-row { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .logo-row img { width:40px; height:40px; filter:drop-shadow(0 2px 6px rgba(99,102,241,.3)); }
  .logo-name { font-size:26px; font-weight:900; letter-spacing:-.5px; }
  .logo-name span:first-child { color:#1E1B4B; }
  .logo-name span:last-child  { color:#4F46E5; }
  .tagline { font-size:13px; color:#6B7280; margin-bottom:36px; }
  h2 { font-size:20px; font-weight:800; color:#111827; margin-bottom:6px; }
  .sub { font-size:13px; color:#6B7280; margin-bottom:28px; }
  .form-group { margin-bottom:18px; }
  label { display:block; font-size:12px; font-weight:700; color:#374151; margin-bottom:6px; }
  input {
    width:100%; padding:11px 14px; border:1.5px solid #D1D5DB;
    border-radius:10px; font-size:14px; color:#111827; transition:border-color .15s;
  }
  input:focus { outline:none; border-color:#4F46E5; box-shadow:0 0 0 3px rgba(79,70,229,.1); }
  .btn {
    width:100%; padding:13px; background:#4F46E5; color:white;
    border:none; border-radius:10px; font-size:14px; font-weight:700;
    cursor:pointer; transition:background .15s; margin-top:8px;
  }
  .btn:hover { background:#3730A3; }
  .btn:disabled { background:#9CA3AF; cursor:not-allowed; }
  .error {
    background:#FEE2E2; color:#991B1B; padding:10px 14px;
    border-radius:8px; font-size:13px; margin-bottom:18px; display:none;
  }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:white; border-radius:50%; animation:spin .6s linear infinite; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .footer { margin-top:28px; text-align:center; font-size:12px; color:#9CA3AF; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <img src="/logo.svg" alt="SkillUp">
    <div class="logo-name"><span>Skill</span><span>Up</span></div>
  </div>
  <div class="tagline">Tuition Management System</div>

  <h2>Welcome back 👋</h2>
  <div class="sub">Sign in to manage your centre</div>

  <div class="error" id="err"></div>

  <form id="login-form">
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="admin@yourcentre.com" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="submit-btn">Sign In</button>
  </form>

  <div class="footer">SkillUp &nbsp;·&nbsp; https://skillup.commerceflow.asia</div>
</div>

<script src="/js/api.js"></script>
<script>
  // Already logged in? Go straight to app
  if (API.isLoggedIn()) window.location.href = '/admin.html';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const err = document.getElementById('err');
    err.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Signing in…';

    try {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      await API.login(email, password);
      window.location.href = '/admin.html';
    } catch (ex) {
      err.textContent = ex.message.includes('credentials') || ex.message.includes('401')
        ? 'Incorrect email or password. Please try again.'
        : ex.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
