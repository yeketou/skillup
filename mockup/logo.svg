<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 182 44">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ── Icon mark ── -->
  <rect width="44" height="44" rx="11" fill="url(#g)" filter="url(#shadow)"/>
  <!-- top-half shine overlay -->
  <rect width="44" height="24" rx="11" fill="url(#shine)"/>

  <!-- ascending skill bars -->
  <rect x="6"  y="31" width="9" height="8"  rx="2.2" fill="#ffffff" fill-opacity="0.40"/>
  <rect x="18" y="22" width="9" height="17" rx="2.2" fill="#ffffff" fill-opacity="0.70"/>
  <rect x="30" y="12" width="9" height="27" rx="2.2" fill="#ffffff"/>

  <!-- golden upward chevron above tallest bar -->
  <polyline points="30.5,9.5 34.5,4 38.5,9.5"
            fill="none" stroke="#FCD34D" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Wordmark ── -->
  <text x="54" y="31"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="23" font-weight="800" letter-spacing="-0.8">
    <tspan fill="#1E1B4B">Skill</tspan><tspan fill="#4F46E5">Up</tspan>
  </text>
</svg>
