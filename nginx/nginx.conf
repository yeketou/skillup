events {
    worker_connections 1024;
}

http {
    upstream backend  { server backend:8088; }
    upstream keycloak { server keycloak:8070; }

    # ── HTTP → HTTPS redirect ───────────────────────────────────────────────
    server {
        listen 80;
        server_name skillup.commerceflow.asia;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name skillup.commerceflow.asia;

        ssl_certificate     /etc/letsencrypt/live/skillup.commerceflow.asia/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/skillup.commerceflow.asia/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 15M;

        # Frontend SPA
        root /usr/share/nginx/html;
        index login.html;

        location / {
            try_files $uri $uri/ /login.html;
        }

        # Spring Boot API
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # Health check (plain JSON — for uptime monitors)
        location /health {
            proxy_pass http://backend/api/actuator/health;
            proxy_set_header Host $host;
        }
    }
}
