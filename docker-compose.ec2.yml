# =============================================================================
# SkillUp — EC2 Production Docker Compose
#
# Differences from local docker-compose.yml:
#   - No MinIO (S3 used instead)
#   - No Redis (ElastiCache used instead — set REDIS_HOST/REDIS_PASSWORD)
#   - No PostgreSQL (RDS used instead — set POSTGRES_HOST)
#   - Backend connects to RDS + ElastiCache via environment variables
#   - Nginx reverse proxy on port 80
# =============================================================================

services:

  # ── Spring Boot Backend ───────────────────────────────────────────────────────
  backend:
    image: ${ECR_IMAGE}
    container_name: skillup-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      # Database (RDS)
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-skillup_db}
      # Redis (ElastiCache)
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Keycloak
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-true}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-skillup}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_PORTAL_CLIENT_ID: ${KEYCLOAK_PORTAL_CLIENT_ID:-skillup-portal}
      KEYCLOAK_PORTAL_CLIENT_SECRET: ${KEYCLOAK_PORTAL_CLIENT_SECRET}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      # S3 Storage
      STORAGE_ENABLED: ${STORAGE_ENABLED:-true}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION:-ap-southeast-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_PRESIGN_EXPIRY: ${STORAGE_PRESIGN_EXPIRY:-15}
      # WhatsApp
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_FROM_NAME: ${WHATSAPP_FROM_NAME:-SkillUp Tuition Centre}
    ports:
      - "8088:8088"
    networks:
      - skillup-net
    depends_on:
      keycloak:
        condition: service_started   # Keycloak image has no curl — use service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Keycloak 24 ──────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: skillup-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/skillup_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_pass}
      KC_HTTP_PORT: 8070
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8070:8070"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    networks:
      - skillup-net
    healthcheck:
      # Keycloak minimal image has no curl — check TCP port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8070 && echo ok >&3 && exec 3>&-"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: skillup-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - skillup-net
    depends_on:
      - backend

networks:
  skillup-net:
    driver: bridge
