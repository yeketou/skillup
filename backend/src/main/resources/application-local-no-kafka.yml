# ─────────────────────────────────────────────────────────────────────────────
# LOCAL-NO-KAFKA PROFILE
# Same as local but also disables any Kafka/async messaging config.
# Use when you don't have Docker running.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

logging:
  level:
    com.skillup: DEBUG
    org.hibernate.SQL: DEBUG
