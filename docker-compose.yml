# ─────────────────────────────────────────────────────────────────────────────
# SkillUp — Local Development Infrastructure
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Wipe:   docker compose down -v    (removes all volumes / data)
#
# PostgreSQL runs NATIVELY on Windows — not here.
# Create the database manually once:
#   psql -U postgres -c "CREATE DATABASE skillup_db;"
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Keycloak 24 ─────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: skillup-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/skillup_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_pass
      KC_HTTP_PORT: 8070
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8070:8070"            # 8070 so it doesn't clash with CommerceFlow Keycloak on 8080
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    networks:
      - skillup-net
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: skillup-redis
    command: redis-server --requirepass skillup_redis_pass
    ports:
      - "6380:6379"            # 6380 externally so it doesn't clash with CommerceFlow Redis on 6379
    volumes:
      - redis_data:/data
    networks:
      - skillup-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "skillup_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Mailpit (Email Testing UI) ───────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: skillup-mailpit
    ports:
      - "8025:8025"            # Web UI  — http://localhost:8025
      - "1025:1025"            # SMTP
    networks:
      - skillup-net
    restart: unless-stopped

  # ── MinIO (S3-compatible local storage) ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: skillup-minio
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: skillup_minio
      MINIO_ROOT_PASSWORD: skillup_minio_pass
    ports:
      - "9002:9002"            # Console — http://localhost:9002
      - "9010:9000"            # S3 API   — use http://localhost:9010 as endpoint
    volumes:
      - minio_data:/data
    networks:
      - skillup-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

# ── Optional tools (pgAdmin) ──────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: skillup-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skillup.local
      PGADMIN_DEFAULT_PASSWORD: admin_pass
    ports:
      - "5051:80"              # http://localhost:5051  (5051 so it doesn't clash with CommerceFlow's pgAdmin)
    networks:
      - skillup-net
    profiles:
      - tools
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:

networks:
  skillup-net:
    driver: bridge
